# Runs the API and the Streamlit UI. Ollama runs on the host by default.
#
#   docker compose up --build
#   docker compose run --rm api python -m scripts.index_documents --yes
#
# To run Ollama in a container instead:
#   OLLAMA_URL=http://ollama:11434 docker compose --profile ollama up --build
#   docker compose exec ollama ollama pull llama3.2:3b

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      JWT_SECRET: ${JWT_SECRET:-}
      RAG_DATA_DIR: /app/data
      RAG_STORAGE_DIR: /app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  frontend:
    build: .
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
      JWT_SECRET: ${JWT_SECRET:-}
      RAG_STORAGE_DIR: /app/storage
    volumes:
      - ./storage:/app/storage
    command: python -m streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      api:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data:

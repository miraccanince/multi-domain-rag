[project]
name = "multi-domain-rag"
version = "0.1.0"
description = "Retrieval-augmented generation over documents from different domains"
requires-python = ">=3.11"
dependencies = [
    # Core
    "langchain==0.3.15",
    "langchain-community==0.3.15",
    "chromadb==0.5.23",
    "posthog<6",  # chromadb 0.5.23 calls the pre-6.0 posthog API; newer versions only produce error log lines
    "pypdf==5.1.0",
    "cryptography>=3.1",  # required for encrypted PDFs
    "sentence-transformers>=5.2.0",  # local embeddings
    "requests>=2.31.0",  # for Ollama API calls
    "pandas>=2.1.4",  # CSV data processing
    "numpy>=2.0",  # streamlit pulls in pyarrow, which requires numpy>=2.0; without this pin,
                   # an unconstrained resolver can pick numpy 1.x and the app fails to start

    # Hybrid retrieval
    "rank-bm25>=0.2.2",  # BM25 keyword search for hybrid retrieval

    # API and frontend
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",  # for form data parsing
    "slowapi>=0.1.9",  # rate limiting for API endpoints
    "python-jose[cryptography]>=3.3.0",  # JWT token handling
    "passlib[bcrypt]>=1.7.4",  # password hashing
    "bcrypt>=4.0.0,<5.0.0",  # pin to 4.x - avoid breaking changes in 5.x
    "streamlit>=1.29.0",
    "streamlit-cookies-manager>=0.2.0",  # cookie management for session persistence
    "plotly>=5.18.0",  # interactive charts for the analytics dashboard

    # Testing
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",  # required by FastAPI's TestClient
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag", "api", "frontend", "scripts"]
